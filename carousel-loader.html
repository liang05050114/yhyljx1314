<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>正在连接旋转木马</title>
  <meta http-equiv="refresh" content="1;url=./carousel-offline/index.html">
  <style>
    :root { color-scheme: light; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      color: #984a70;
      background:
        radial-gradient(circle at 50% 38%, rgba(255,255,255,.94), transparent 28%),
        linear-gradient(145deg, #ffeef6, #f5bfd6);
    }
    .loader-card {
      width: min(88vw, 430px);
      padding: 40px 30px;
      border: 1px solid rgba(255,255,255,.86);
      border-radius: 28px;
      background: rgba(255,255,255,.78);
      box-shadow: 0 22px 55px rgba(153,74,112,.2);
      text-align: center;
      backdrop-filter: blur(14px);
    }
    .spinner {
      width: 54px;
      height: 54px;
      margin: 0 auto 22px;
      border: 5px solid rgba(237,126,173,.22);
      border-top-color: #ed7ead;
      border-radius: 50%;
      animation: spin .85s linear infinite;
    }
    h1 { margin: 0; font-size: 1.35rem; letter-spacing: .08em; }
    p { margin: 12px 0 0; color: rgba(152,74,112,.72); font-size: .92rem; line-height: 1.7; }
    button {
      display: none;
      margin: 22px auto 0;
      min-width: 130px;
      min-height: 44px;
      border: 0;
      border-radius: 999px;
      color: #fff;
      background: linear-gradient(145deg, #ffb1d0, #ed7ead);
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    .is-error .spinner { display: none; }
    .is-error button { display: block; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }
  </style>
</head>
<body>
  <main class="loader-card" id="loader-card">
    <div class="spinner" aria-hidden="true"></div>
    <h1>正在连接旋转木马…</h1>
    <p id="loader-message">离线游园灯正在打开，不需要网络或本地服务器。</p>
    <button id="retry-button" type="button">重新连接</button>
  </main>
  <script>
    (function () {
      "use strict";
      var target = "./carousel-offline/index.html";
      var retry = document.getElementById("retry-button");
      window.setTimeout(function () {
        window.location.replace(target);
      }, 900);
      retry.addEventListener("click", function () {
        window.location.replace(target);
      });
    })();
  </script>
</body>
</html>
